<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima e Previsão - {{CITY}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #4cc9f0;
            --bg-dark: #0f172a;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover { transform: translateY(-5px); border-color: rgba(76, 201, 240, 0.3); }

        .current-weather {
            grid-column: span 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-info h1 {
            font-size: 1.2rem;
            font-weight: 300;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .temp-display { display: flex; align-items: center; gap: 1.5rem; margin: 1rem 0; }

        .temp-value {
            font-size: 5rem;
            font-weight: 600;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .condition-icon { width: 80px; height: 80px; filter: drop-shadow(0 0 10px var(--accent)); }

        .condition-text { font-size: 1.5rem; color: var(--accent); margin-bottom: 0.5rem; }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .detail-item { text-align: center; }
        .detail-label { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.2rem; }
        .detail-value { font-weight: 600; }

        .forecast-section {
            grid-column: span 2;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .forecast-card { display: flex; align-items: center; justify-content: space-between; padding: 1.5rem 2rem; }
        .forecast-date { font-size: 1.1rem; font-weight: 600; }
        .forecast-temp { display: flex; gap: 1rem; align-items: center; }
        .max { color: #ff4d6d; font-weight: 600; }
        .min { color: #4cc9f0; font-weight: 600; }
        .forecast-icon { width: 40px; height: 40px; }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .current-weather, .forecast-section { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Current Weather -->
    <div class="card current-weather">
        <div class="main-info">
            <h1>{{CITY}}</h1>
            <div class="temp-display">
                <span class="temp-value">{{CURRENT_TEMP}}°C</span>
                <img src="{{CONDITION_ICON_URL}}" alt="{{CONDITION_DESC}}" class="condition-icon">
            </div>
            <div class="condition-text">{{CONDITION_DESC}}</div>
            <div class="details-grid">
                <div class="detail-item">
                    <div class="detail-label">Humidade</div>
                    <div class="detail-value">{{HUMIDITY}}%</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Vento</div>
                    <div class="detail-value">{{WIND_SPEED}}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Nuvens</div>
                    <div class="detail-value">{{CLOUDS}}%</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Forecast Section -->
    <div class="forecast-section">
        <!-- Template Block for Forecast (to be repeated) -->
        {{FORECAST_BLOCKS}}
    </div>
</div>

</body>
</html>
